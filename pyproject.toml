[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makemeswitch"
version = "1.0.1"
description = "Turn a Linux PC into a managed Ethernet switch with a Cisco-inspired CLI and web panel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MakeMeSwitch CLI contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
    "PyYAML>=6.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "asyncssh>=2.14",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12.0"]

[project.scripts]
makemeswitch = "makemeswitch.main:main"

[tool.setuptools.packages.find]
include = ["makemeswitch*"]

[tool.setuptools.package-data]
makemeswitch = ["web/dist/**/*", "web/dist/*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires root, Open vSwitch and network namespaces",
]
