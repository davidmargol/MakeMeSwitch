# Layer 3: two SVIs route between VLAN 10 and VLAN 20, plus one static route
# towards a upstream router.  SVIs are OVS internal ports (vlan10 / vlan20)
# with Linux addresses on top; ip_forward is enabled while routing is on.

enable
configure terminal
hostname LAB-L3

vlan 10
 name SERVERS
exit
vlan 20
 name CLIENTS
exit

interface ethernet 1/1
 description server
 switchport attach enp1s0
 switchport mode access
 switchport access vlan 10
 no shutdown
exit

interface ethernet 1/2
 description desktop
 switchport attach enp2s0
 switchport mode access
 switchport access vlan 20
 no shutdown
exit

ip routing

interface vlan 10
 ip address 192.168.10.1/24
 no shutdown
exit

interface vlan 20
 ip address 192.168.20.1/24
 no shutdown
exit

ip route 0.0.0.0/0 192.168.10.254

end
write memory
