# Access ports only: two VLANs, one server pair and two clients.
# Replace enp1s0/enp2s0/enx... with the NICs shown by
#   show interfaces mapping
# Apply with:  sudo examples/apply.sh examples/lab-access.cfg

enable
configure terminal
hostname LAB-SW01

vlan 10
 name SERVERS
exit
vlan 20
 name CLIENTS
exit

interface ethernet 1/1
 description core uplink
 switchport attach enp1s0
 switchport mode access
 switchport access vlan 10
 no shutdown
exit

interface ethernet 1/2
 description app server 01
 switchport attach enp2s0
 switchport mode access
 switchport access vlan 10
 no shutdown
exit

interface ethernet 1/3
 description workstation
 switchport attach enx001122334455
 switchport mode access
 switchport access vlan 20
 no shutdown
exit

end
write memory
