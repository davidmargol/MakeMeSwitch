# Access ports plus an 802.1Q trunk towards another switch.
# Port Ethernet1/4 carries VLAN 10 and 20 tagged, VLAN 1 untagged (native).

enable
configure terminal
hostname LAB-SW02

vlan 10
 name SERVERS
exit
vlan 20
 name CLIENTS
exit
vlan 99
 name MGMT
exit

interface ethernet 1/1
 description server
 switchport attach enp1s0
 switchport mode access
 switchport access vlan 10
 no shutdown
exit

interface ethernet 1/2
 description desktop
 switchport attach enp2s0
 switchport mode access
 switchport access vlan 20
 no shutdown
exit

interface ethernet 1/3
 description uplink to LAB-SW01
 switchport attach enp3s0
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 switchport trunk native vlan 99
 no shutdown
exit

end
write memory
